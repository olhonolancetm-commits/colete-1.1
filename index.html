<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelada Pro v6.0 | Tactical Intelligence & Scouting</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --fifa-gold: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #b45309 100%);
            --glass-bg: rgba(15, 23, 42, 0.8);
        }
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; scroll-behavior: smooth; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }

        /* ESTÁDIO 3D */
        .stadium-viewport { perspective: 2000px; padding: 80px 0; background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); overflow: hidden; }
        #field-3d {
            width: 850px; height: 550px; background: #065f46; border: 6px solid #f8fafc; position: relative;
            margin: 0 auto; transform: rotateX(50deg) translateZ(0); box-shadow: 0 80px 150px rgba(0,0,0,0.9);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 70px, rgba(0,0,0,0.05) 70px, rgba(0,0,0,0.05) 140px);
        }
        .pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.8); pointer-events: none; }
        .center-circle { top: 50%; left: 50%; width: 140px; height: 140px; border-radius: 50%; transform: translate(-50%, -50%); border: 3px solid white; }
        .mid-line { top: 0; bottom: 0; left: 50%; width: 0; border: 1px solid white; }
        .box-large { position: absolute; left: 20%; right: 20%; height: 110px; border: 3px solid white; }
        .top-box { top: 0; border-top: 0; } .bot-box { bottom: 0; border-bottom: 0; }

        /* CARD FIFA */
        #capture-area { padding: 20px; background: transparent; }
        .fifa-card {
            width: 320px; height: 460px; position: relative; background: var(--fifa-gold);
            clip-path: polygon(0% 15%, 50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%);
            color: #451a03; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-inner { padding: 45px 25px; position: relative; height: 100%; z-index: 5; }
        .player-img { width: 200px; height: 200px; position: absolute; top: 35px; right: -10px; object-fit: cover; mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }
        .rating-badge { position: absolute; top: 50px; left: 30px; }
        .overall { font-size: 64px; font-weight: 900; line-height: 1; }
        .position { font-size: 24px; font-weight: 700; text-transform: uppercase; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 130px; border-top: 2px solid rgba(0,0,0,0.1); padding-top: 15px; }
        .stat-item { font-size: 18px; font-weight: 900; display: flex; justify-content: space-between; }
        .stat-label { color: rgba(0,0,0,0.6); font-weight: 600; }
        .kpi-box { @apply glass p-6 rounded-[2rem] border-t-4 border-transparent transition-all duration-300 hover:border-amber-500 hover:-translate-y-2; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-80 glass border-r border-white/10 p-8 flex flex-col gap-8 z-50">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-amber-500 rounded-3xl flex items-center justify-center font-black text-3xl text-black">P</div>
            <h1 class="font-black text-2xl italic tracking-tighter text-white">PELADA<span class="text-amber-500">PRO</span></h1>
        </div>

        <div class="space-y-4">
            <input type="text" id="nameIn" placeholder="Nome do Atleta" class="w-full bg-slate-900/50 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-amber-500 text-white">
            <div class="grid grid-cols-2 gap-2">
                <select id="posIn" class="bg-slate-900/50 border border-white/10 p-4 rounded-2xl text-sm text-white outline-none"><option value="ATA">Atacante</option><option value="MEI">Meio-Campo</option><option value="DEF">Zagueiro</option></select>
                <select id="sideIn" class="bg-slate-900/50 border border-white/10 p-4 rounded-2xl text-sm text-white outline-none"><option value="up">Ataca ↑</option><option value="down">Ataca ↓</option></select>
            </div>
            <input type="file" id="photoIn" accept="image/*" class="text-xs text-slate-500 file:bg-amber-500 file:rounded-xl file:border-0 file:px-4 file:py-2">
            
            <div class="pt-4 border-t border-white/5">
                <label class="flex items-center justify-center gap-3 bg-white text-black p-5 rounded-[2rem] font-black cursor-pointer hover:bg-amber-500 transition-all shadow-xl">
                    ABRIR JOGO (CSV)
                    <input type="file" id="csvFileInput" class="hidden" accept=".csv">
                </label>
            </div>
        </div>

        <nav class="mt-auto flex flex-col gap-2">
            <button onclick="switchTab('dashboard')" class="text-left p-4 rounded-2xl text-amber-500 font-black">DASHBOARD</button>
            <button onclick="switchTab('history')" class="text-left p-4 rounded-2xl text-slate-400 font-bold">HISTÓRICO</button>
        </nav>
    </aside>

    <!-- MAIN PANEL -->
    <main class="flex-1 overflow-y-auto">
        <section id="tab-dashboard" class="p-10 space-y-10">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-6xl font-black italic uppercase text-white" id="titleName">NOVO RECRUTA</h2>
                    <p id="dateShow" class="text-slate-500 font-bold mt-2 tracking-widest uppercase">Aguardando arquivo...</p>
                </div>
                <div class="flex gap-4">
                    <button onclick="downloadCard()" id="btnDl" class="hidden glass px-8 py-4 rounded-2xl font-black text-sm">PNG</button>
                    <button onclick="saveSession()" id="btnSave" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-10 py-4 rounded-2xl font-black text-sm transition-all">SALVAR</button>
                </div>
            </div>

            <!-- KPIs -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase italic">Distância</p><h3 class="text-4xl font-black mt-2 text-white" id="kpi-dist">0.00 <small class="text-lg font-normal opacity-50">km</small></h3></div>
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase italic">V. Máxima</p><h3 class="text-4xl font-black mt-2 text-orange-500" id="kpi-max">0.0 <small class="text-lg font-normal opacity-50">km/h</small></h3></div>
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase italic">V. Média</p><h3 class="text-4xl font-black mt-2 text-blue-400" id="kpi-avg">0.0 <small class="text-lg font-normal opacity-50">km/h</small></h3></div>
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase italic">Sprints</p><h3 class="text-4xl font-black mt-2 text-emerald-400" id="kpi-sprints">0</h3></div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-12 gap-10">
                <div class="xl:col-span-4 flex justify-center">
                    <div id="capture-area">
                        <div class="fifa-card" id="main-card">
                            <div class="card-inner">
                                <div class="rating-badge"><div class="overall" id="cardOvr">--</div><div class="position" id="cardPos">POS</div></div>
                                <img id="cardPhoto" src="https://via.placeholder.com/300" class="player-img">
                                <div class="mt-auto">
                                    <div class="text-3xl font-black uppercase text-center border-b-4 border-black/10 pb-2 mb-4" id="cardName">JOGADOR</div>
                                    <div class="stat-grid">
                                        <div class="stat-item"><span class="stat-label">VEL</span> <span id="s-pac">--</span></div>
                                        <div class="stat-item"><span class="stat-label">DRI</span> <span id="s-dri">--</span></div>
                                        <div class="stat-item"><span class="stat-label">ATA</span> <span id="s-sho">--</span></div>
                                        <div class="stat-item"><span class="stat-label">DEF</span> <span id="s-def">--</span></div>
                                        <div class="stat-item"><span class="stat-label">PAS</span> <span id="s-pas">--</span></div>
                                        <div class="stat-item"><span class="stat-label">FIS</span> <span id="s-phy">--</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="xl:col-span-8 space-y-6">
                    <div class="glass p-8 rounded-[2.5rem] border-l-8 border-amber-500"><h4 class="text-amber-500 font-black text-xs uppercase mb-2">Relatório IA</h4><p id="aiReport" class="text-slate-300 italic">Aguardando dados...</p></div>
                    <div class="glass p-8 rounded-[2.5rem] h-64"><canvas id="loadChart"></canvas></div>
                </div>
            </div>

            <div class="stadium-viewport">
                <div id="field-3d">
                    <div class="mid-line"></div><div class="center-circle"></div>
                    <div class="pitch-line box-large top-box"></div><div class="pitch-line box-large bot-box"></div>
                    <div id="heatmapContainer" class="absolute inset-0"></div>
                </div>
            </div>
        </section>

        <section id="tab-history" class="hidden p-12 animate-in fade-in"><div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-12"></div></section>
    </main>

    <script>
        let heatmapInstance, loadChart, currentData = null, photoData = "https://via.placeholder.com/300";

        window.onload = () => {
            heatmapInstance = h337.create({ container: document.getElementById('heatmapContainer'), radius: 30, blur: .8 });
            renderHistory();
        };

        function switchTab(t) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', t !== 'dashboard');
            document.getElementById('tab-history').classList.toggle('hidden', t !== 'history');
        }

        document.getElementById('photoIn').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => { photoData = ev.target.result; document.getElementById('cardPhoto').src = photoData; };
            reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('csvFileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => processGPSFile(ev.target.result);
            reader.readAsText(e.target.files[0]);
        });

        function processGPSFile(text) {
            // Divide o arquivo em linhas e limpa espaços vazios
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let dataRows = [];

            // Filtrar apenas as linhas que começam com números (telemetria GPS)
            // O formato do seu ESP32 é: Tempo_ms, Data, Hora, Lat, Lng, Vel...
            lines.forEach(line => {
                const cols = line.split(',');
                // Verifica se a primeira coluna é um número e se tem pelo menos 6 colunas (até velocidade)
                if (!isNaN(parseFloat(cols[0])) && cols.length >= 6) {
                    const lat = parseFloat(cols[3]);
                    const lng = parseFloat(cols[4]);
                    const vel = parseFloat(cols[5]);
                    
                    // Só adiciona se tiver um GPS Fix válido (lat/lng diferente de 0)
                    if (lat !== 0 && lng !== 0) {
                        dataRows.push({ lat, lng, vel, time: cols[2] });
                    }
                }
            });

            if (dataRows.length === 0) {
                alert("Erro: O arquivo não contém dados GPS válidos.");
                return;
            }

            const lats = dataRows.map(r => r.lat);
            const lngs = dataRows.map(r => r.lng);
            const speeds = dataRows.map(r => r.vel);
            const times = dataRows.map(r => r.time);

            const minLat = Math.min(...lats), maxLat = Math.max(...lats);
            const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);

            const heatPoints = dataRows.map(r => ({
                x: Math.floor(((r.lng - minLng) / (maxLng - minLng || 1)) * 850),
                y: Math.floor(((r.lat - minLat) / (maxLat - minLat || 1)) * 550),
                value: r.vel > 15 ? 10 : 1
            }));

            const vMax = Math.max(...speeds);
            const vAvg = speeds.reduce((a,b)=>a+b, 0) / speeds.length;
            const dist = (vAvg * (dataRows.length / 3600)) * 2.5; // Estimativa simples baseada em tempo/velocidade

            const role = document.getElementById('posIn').value;
            const stats = {
                pac: Math.min(Math.round((vMax/30)*99), 99),
                sho: role === 'ATA' ? 88 : 45,
                def: role === 'DEF' ? 92 : 35,
                fis: 82, pas: 78, dri: 85,
                dist: dist.toFixed(2), vMax: vMax.toFixed(1), vAvg: vAvg.toFixed(1),
                sprints: speeds.filter(s => s > 20).length
            };

            currentData = {
                name: document.getElementById('nameIn').value || "JOGADOR",
                role, date: new Date().toLocaleDateString(),
                ovr: Math.round((stats.pac + stats.fis + (role === 'ATA' ? stats.sho : stats.def)) / 3),
                stats, heatPoints, speeds, times, photo: photoData
            };

            updateUI();
        }

        function updateUI() {
            const d = currentData;
            document.getElementById('cardOvr').innerText = d.ovr;
            document.getElementById('cardPos').innerText = d.role;
            document.getElementById('titleName').innerText = d.name;
            document.getElementById('cardName').innerText = d.name;
            document.getElementById('dateShow').innerText = "PARTIDA: " + d.date;
            
            ['pac','sho','def','fis','pas','dri'].forEach(s => document.getElementById(`s-${s}`).innerText = d.stats[s]);
            
            document.getElementById('kpi-dist').innerHTML = `${d.stats.dist} <small class="text-lg font-normal opacity-50">km</small>`;
            document.getElementById('kpi-max').innerText = d.stats.vMax;
            document.getElementById('kpi-avg').innerText = d.stats.vAvg;
            document.getElementById('kpi-sprints').innerText = d.stats.sprints;

            document.getElementById('btnSave').classList.remove('hidden');
            document.getElementById('btnDl').classList.remove('hidden');

            heatmapInstance.setData({ max: 10, data: d.heatPoints });
            renderChart();
            document.getElementById('aiReport').innerText = `Atleta ${d.name} demonstrou intensidade ${d.stats.pac > 80 ? 'Elite' : 'Moderada'}. Velocidade máxima de ${d.stats.vMax} km/h detectada.`;
        }

        function renderChart() {
            if (loadChart) loadChart.destroy();
            const ctx = document.getElementById('loadChart').getContext('2d');
            loadChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: currentData.times.filter((_,i) => i % 20 === 0),
                    datasets: [{ data: currentData.speeds.filter((_,i) => i % 20 === 0), borderColor: '#f59e0b', fill: true, backgroundColor: 'rgba(245, 158, 11, 0.1)', tension: 0.4, pointRadius: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: {legend:{display:false}}, scales: { x:{display:false}, y:{grid:{color:'rgba(255,255,255,0.05)'}} } }
            });
        }

        function saveSession() {
            let h = JSON.parse(localStorage.getItem('pelada_pro_v6')) || [];
            h.unshift(currentData);
            localStorage.setItem('pelada_pro_v6', JSON.stringify(h.slice(0, 20)));
            alert("Card salvo!");
            renderHistory();
        }

        function renderHistory() {
            const h = JSON.parse(localStorage.getItem('pelada_pro_v6')) || [];
            const g = document.getElementById('historyGrid');
            g.innerHTML = h.map((c, i) => `
                <div class="glass p-6 rounded-[2rem] flex flex-col items-center gap-4">
                    <div class="text-xl font-black uppercase">${c.name}</div>
                    <div class="text-4xl font-black text-amber-500">${c.ovr}</div>
                    <button onclick="loadCard(${i})" class="bg-amber-500 text-black px-6 py-2 rounded-full font-black text-xs">REVISAR</button>
                </div>
            `).join('');
        }

        function loadCard(i) {
            currentData = JSON.parse(localStorage.getItem('pelada_pro_v6'))[i];
            updateUI(); switchTab('dashboard');
        }

        function downloadCard() {
            html2canvas(document.querySelector("#capture-area"), {backgroundColor:null}).then(canvas => {
                const a = document.createElement('a'); a.download = 'card.png'; a.href = canvas.toDataURL(); a.click();
            });
        }
    </script>
</body>
</html>
