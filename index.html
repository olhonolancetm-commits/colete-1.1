<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelada Pro v6.0 | Tactical Intelligence & Scouting</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --fifa-gold: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #b45309 100%);
            --glass-bg: rgba(15, 23, 42, 0.8);
        }
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }

        /* STADIUM 3D */
        .stadium-viewport { perspective: 2000px; padding: 80px 0; background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); overflow: hidden; }
        #field-3d {
            width: 850px; height: 550px; background: #065f46; border: 6px solid #f8fafc; position: relative;
            margin: 0 auto; transform: rotateX(50deg) translateZ(0); box-shadow: 0 80px 150px rgba(0,0,0,0.9);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 70px, rgba(0,0,0,0.05) 70px, rgba(0,0,0,0.05) 140px);
        }
        .pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.8); pointer-events: none; }
        .center-circle { top: 50%; left: 50%; width: 140px; height: 140px; border-radius: 50%; transform: translate(-50%, -50%); border: 3px solid white; }
        .mid-line { top: 0; bottom: 0; left: 50%; width: 0; border: 1px solid white; }
        .box-large { position: absolute; left: 20%; right: 20%; height: 110px; border: 3px solid white; }
        .top-box { top: 0; border-top: 0; } .bot-box { bottom: 0; border-bottom: 0; }
        .penalty-dot { position: absolute; left: 50%; width: 8px; height: 8px; background: white; border-radius: 50%; transform: translateX(-50%); }

        /* FIFA CARD */
        #capture-area { padding: 20px; background: transparent; }
        .fifa-card {
            width: 320px; height: 460px; position: relative; background: var(--fifa-gold);
            clip-path: polygon(0% 15%, 50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%);
            color: #451a03; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-inner { padding: 45px 25px; position: relative; height: 100%; z-index: 5; }
        .player-img { width: 200px; height: 200px; position: absolute; top: 35px; right: -10px; object-fit: cover; mask-image: linear-gradient(to bottom, black 75%, transparent 100%); }
        .rating-badge { position: absolute; top: 50px; left: 30px; }
        .overall { font-size: 64px; font-weight: 900; line-height: 1; }
        .position { font-size: 24px; font-weight: 700; text-transform: uppercase; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 130px; border-top: 2px solid rgba(0,0,0,0.1); padding-top: 15px; }
        .stat-item { font-size: 18px; font-weight: 900; display: flex; justify-content: space-between; }
        .stat-label { color: rgba(0,0,0,0.6); font-weight: 600; }
        .kpi-box { @apply glass p-6 rounded-[2rem] border-t-4 border-transparent transition-all duration-300 hover:border-amber-500 hover:-translate-y-2; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-80 glass border-r border-white/10 p-8 flex flex-col gap-8 z-50">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-amber-500 rounded-3xl flex items-center justify-center font-black text-3xl text-black">P</div>
            <div>
                <h1 class="font-black text-2xl italic tracking-tighter leading-none text-white">PELADA<span class="text-amber-500">PRO</span></h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Scouting & Tactics</p>
            </div>
        </div>

        <div class="space-y-6">
            <div class="space-y-2">
                <input type="text" id="nameIn" placeholder="Nome do Jogador" class="w-full bg-slate-900/50 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-amber-500 text-white">
                <div class="grid grid-cols-2 gap-2">
                    <select id="posIn" class="bg-slate-900/50 border border-white/10 p-4 rounded-2xl text-sm text-white outline-none"><option value="ATA">Atacante</option><option value="MEI">Meio-Campo</option><option value="DEF">Zagueiro</option></select>
                    <select id="sideIn" class="bg-slate-900/50 border border-white/10 p-4 rounded-2xl text-sm text-white outline-none"><option value="up">Ataca ↑</option><option value="down">Ataca ↓</option></select>
                </div>
            </div>
            <input type="file" id="photoIn" accept="image/*" class="text-xs text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-2xl file:border-0 file:bg-amber-500 file:text-black file:font-black">
            <div class="pt-4 border-t border-white/5">
                <label class="flex items-center justify-center gap-3 bg-white text-black p-5 rounded-[2rem] font-black cursor-pointer hover:bg-amber-500 transition-all shadow-xl">
                    IMPORTAR GPS (CSV)
                    <input type="file" id="csvFileInput" class="hidden">
                </label>
            </div>
        </div>

        <nav class="mt-auto flex flex-col gap-2">
            <button onclick="switchTab('dashboard')" class="text-left p-4 rounded-2xl text-amber-500 font-black">DASHBOARD</button>
            <button onclick="switchTab('history')" class="text-left p-4 rounded-2xl text-slate-400 font-bold">COLEÇÃO</button>
        </nav>
    </aside>

    <!-- MAIN PANEL -->
    <main class="flex-1 overflow-y-auto">
        <section id="tab-dashboard" class="p-10 space-y-10">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-6xl font-black italic tracking-tighter uppercase text-white" id="titleName">NOVO RECRUTA</h2>
                    <p class="text-slate-500 font-bold mt-2" id="dateShow">Aguardando telemetria...</p>
                </div>
                <div class="flex gap-4">
                    <button onclick="downloadCard()" id="btnDl" class="hidden glass px-8 py-4 rounded-2xl font-black text-sm">EXPORTAR PNG</button>
                    <button onclick="saveSession()" id="btnSave" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-10 py-4 rounded-2xl font-black text-sm transition-all">SALVAR CARD</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase">Distância Real</p><h3 class="text-4xl font-black mt-2 text-white" id="kpi-dist">0.00 <span class="text-lg font-normal">km</span></h3></div>
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase">Velocidade Máxima</p><h3 class="text-4xl font-black mt-2 text-orange-500" id="kpi-max">0.0 <span class="text-lg font-normal">km/h</span></h3></div>
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase">Sprints Elite</p><h3 class="text-4xl font-black mt-2 text-emerald-500" id="kpi-sprints">0</h3></div>
                <div class="kpi-box"><p class="text-[10px] font-black text-slate-500 uppercase">Ritmo Médio</p><h3 class="text-4xl font-black mt-2 text-blue-500" id="kpi-avg">0.0 <span class="text-lg font-normal">km/h</span></h3></div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-12 gap-10">
                <div class="xl:col-span-4 flex flex-col items-center gap-6">
                    <div id="capture-area">
                        <div class="fifa-card" id="main-card">
                            <div class="card-inner">
                                <div class="rating-badge"><div class="overall" id="cardOvr">--</div><div class="position" id="cardPos">POS</div></div>
                                <img id="cardPhoto" src="https://via.placeholder.com/300" class="player-img">
                                <div class="mt-auto">
                                    <div class="text-3xl font-black uppercase text-center border-b-4 border-black/10 pb-2 mb-4" id="cardName">JOGADOR</div>
                                    <div class="stat-grid">
                                        <div class="stat-item"><span class="stat-label">VEL</span> <span id="s-pac">--</span></div>
                                        <div class="stat-item"><span class="stat-label">DRI</span> <span id="s-dri">--</span></div>
                                        <div class="stat-item"><span class="stat-label">ATA</span> <span id="s-sho">--</span></div>
                                        <div class="stat-item"><span class="stat-label">DEF</span> <span id="s-def">--</span></div>
                                        <div class="stat-item"><span class="stat-label">PAS</span> <span id="s-pas">--</span></div>
                                        <div class="stat-item"><span class="stat-label">FIS</span> <span id="s-phy">--</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="xl:col-span-8 flex flex-col gap-8">
                    <div class="glass p-8 rounded-[2.5rem] border-l-8 border-amber-500"><h4 class="text-amber-500 font-black text-xs uppercase mb-4 tracking-widest">Diagnóstico IA</h4><p id="aiReport" class="text-slate-300 italic text-lg leading-relaxed font-medium">Aguardando importação para análise tática...</p></div>
                    <div class="glass p-8 rounded-[2.5rem] flex-1 min-h-[300px]"><canvas id="loadChart"></canvas></div>
                </div>
            </div>

            <div class="stadium-viewport">
                <div id="field-3d">
                    <div class="mid-line"></div><div class="center-circle"></div>
                    <div class="pitch-line box-large top-box"></div><div class="pitch-line box-large bot-box"></div>
                    <div class="penalty-dot" style="top: 85px;"></div><div class="penalty-dot" style="bottom: 85px;"></div>
                    <div id="heatmapContainer" class="absolute inset-0"></div>
                </div>
            </div>
        </section>

        <section id="tab-history" class="hidden p-12 space-y-12 animate-in fade-in"><div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-12"></div></section>
    </main>

    <script>
        let heatmapInstance, loadChart, currentData = null, photoData = "https://via.placeholder.com/300";

        window.onload = () => {
            heatmapInstance = h337.create({ container: document.getElementById('heatmapContainer'), radius: 35, blur: .85, maxOpacity: .6 });
            renderHistory();
        };

        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');
        }

        document.getElementById('photoIn').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (ev) => { photoData = ev.target.result; document.getElementById('cardPhoto').src = photoData; };
            reader.readAsDataURL(e.target.files[0]);
        });

        // MOTOR DE LEITURA UNIVERSAL (O FIX)
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (ev) => processGPSFile(ev.target.result);
            reader.readAsText(e.target.files[0]);
        });

        function processGPSFile(text) {
            let rows = [];
            try {
                // Tenta JSON (caso seja exportação de Excel estruturada)
                if (text.trim().startsWith('[') || text.trim().startsWith('{')) {
                    const json = JSON.parse(text);
                    const raw = json[0]?.d || json;
                    rows = raw.filter(r => Array.isArray(r));
                } else {
                    // CSV Puro
                    rows = text.split('\n').map(l => l.split(','));
                }
            } catch(e) { alert("Erro de leitura."); return; }

            // Identifica as colunas dinamicamente
            let latIdx = 3, lngIdx = 4, velIdx = 5, timeIdx = 2;
            let headerFound = false;

            for(let i=0; i < Math.min(rows.length, 20); i++){
                if(rows[i].includes('Latitude') || rows[i].includes('Latitude_deg')){
                    latIdx = rows[i].indexOf('Latitude') !== -1 ? rows[i].indexOf('Latitude') : rows[i].indexOf('Latitude_deg');
                    lngIdx = rows[i].indexOf('Longitude') !== -1 ? rows[i].indexOf('Longitude') : rows[i].indexOf('Longitude_deg');
                    velIdx = rows[i].indexOf('Velocidade') !== -1 ? rows[i].indexOf('Velocidade') : rows[i].indexOf('Velocidade_ms');
                    timeIdx = rows[i].indexOf('Hora_UTC') !== -1 ? rows[i].indexOf('Hora_UTC') : 2;
                    headerFound = true; rows = rows.slice(i + 1); break;
                }
            }

            let validData = rows.filter(r => r[latIdx] && !isNaN(parseFloat(r[latIdx])) && parseFloat(r[latIdx]) !== 0);
            if (!validData.length) { alert("GPS sem dados válidos."); return; }

            let lats = validData.map(r => parseFloat(r[latIdx]));
            let lngs = validData.map(r => parseFloat(r[lngIdx]));
            let speeds = validData.map(r => parseFloat(r[velIdx]) || 0);
            let times = validData.map(r => r[timeIdx] || "00:00");

            // Haversine
            let realDist = 0;
            for(let i=1; i<lats.length; i++) {
                const R = 6371e3, p1 = lats[i-1]*Math.PI/180, p2 = lats[i]*Math.PI/180;
                const dLat = (lats[i]-lats[i-1])*Math.PI/180, dLng = (lngs[i]-lngs[i-1])*Math.PI/180;
                const a = Math.sin(dLat/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dLng/2)**2;
                realDist += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }

            const cLat = lats.slice(0,10).reduce((a,b)=>a+b,0)/10, cLng = lngs.slice(0,10).reduce((a,b)=>a+b,0)/10;
            const mLat = Math.max(...lats.map(l => Math.abs(l-cLat))) || 0.001, mLng = Math.max(...lngs.map(l => Math.abs(l-cLng))) || 0.001;

            const heatPoints = lats.map((lat, i) => ({
                x: Math.floor(((lngs[i] - (cLng - mLng)) / (mLng * 2)) * 850),
                y: Math.floor(((lat - (cLat - mLat)) / (mLat * 2)) * 550),
                value: speeds[i] > 18 ? 10 : 1
            }));

            const side = document.getElementById('sideIn').value, role = document.getElementById('posIn').value;
            const attCount = heatPoints.filter(p => side === 'up' ? p.y < 275 : p.y > 275).length;
            const vMax = Math.max(...speeds), vAvg = (speeds.reduce((a,b)=>a+b,0)/speeds.length);

            currentData = {
                name: document.getElementById('nameIn').value || "JOGADOR", role, date: new Date().toLocaleDateString(),
                ovr: Math.round((vMax/30)*40 + (attCount/heatPoints.length)*40 + 20),
                stats: { pac: Math.min(Math.round((vMax/32)*99), 99), sho: Math.round((attCount/heatPoints.length)*99), def: Math.round(((heatPoints.length-attCount)/heatPoints.length)*99), phy: Math.min(Math.round((realDist/6000)*99), 99), pas: 85, dri: 88, dist: (realDist/1000).toFixed(2), vMax: vMax.toFixed(1), vAvg: vAvg.toFixed(1), sprints: speeds.filter(s=>s>21).length },
                heatPoints, speeds, times, photo: photoData
            };
            updateUI();
        }

        function updateUI() {
            const d = currentData;
            document.getElementById('cardOvr').innerText = d.ovr; document.getElementById('cardPos').innerText = d.role;
            ['pac','sho','def','phy','pas','dri'].forEach(s => document.getElementById(`s-${s}`).innerText = d.stats[s]);
            document.getElementById('kpi-dist').innerHTML = `${d.stats.dist} <span class="text-lg font-normal">km</span>`;
            document.getElementById('kpi-max').innerText = `${d.stats.vMax} km/h`;
            document.getElementById('kpi-avg').innerText = `${d.stats.vAvg} km/h`;
            document.getElementById('kpi-sprints').innerText = d.stats.sprints;
            document.getElementById('btnSave').classList.remove('hidden'); document.getElementById('btnDl').classList.remove('hidden');
            heatmapInstance.setData({ max: 20, data: d.heatPoints });
            renderChart();
            document.getElementById('aiReport').innerText = `O atleta ${d.name} percorreu ${d.stats.dist}km. Perfil ${d.ovr > 80 ? 'Elite' : 'Competitivo'} com ${d.stats.sprints} sprints de alta intensidade.`;
        }

        function renderChart() {
            if (loadChart) loadChart.destroy();
            const ctx = document.getElementById('loadChart').getContext('2d');
            loadChart = new Chart(ctx, {
                type: 'line',
                data: { labels: currentData.times.filter((_,i)=>i%30===0), datasets: [{ data: currentData.speeds.filter((_,i)=>i%30===0), borderColor: '#f59e0b', fill: true, backgroundColor: 'rgba(245, 158, 11, 0.1)', tension: 0.4, pointRadius: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: {legend:{display:false}}, scales: { x:{display:false}, y:{grid:{color:'rgba(255,255,255,0.05)'}} } }
            });
        }

        function downloadCard() { html2canvas(document.querySelector("#capture-area"), { backgroundColor: null }).then(canvas => { const a = document.createElement('a'); a.download = `Card-${currentData.name}.png`; a.href = canvas.toDataURL(); a.click(); }); }
        function saveSession() { let h = JSON.parse(localStorage.getItem('pelada_db') || '[]'); h.unshift(currentData); localStorage.setItem('pelada_db', JSON.stringify(h.slice(0,50))); alert("Card Salvo!"); renderHistory(); }
        function renderHistory() {
            const h = JSON.parse(localStorage.getItem('pelada_db') || '[]');
            document.getElementById('historyGrid').innerHTML = h.map((c, i) => `
                <div class="glass p-6 rounded-[2rem] flex flex-col items-center gap-4">
                    <div class="fifa-card scale-[0.6] -my-24">
                        <div class="card-inner"><div class="rating-badge"><div class="overall">${c.ovr}</div><div class="position">${c.role}</div></div><img src="${c.photo}" class="player-img"><div class="mt-auto"><div class="text-2xl font-black text-center uppercase">${c.name}</div></div></div>
                    </div>
                    <button onclick="loadFromHistory(${i})" class="bg-amber-500 text-black px-6 py-2 rounded-full font-black text-xs">REVISAR</button>
                </div>
            `).join('');
        }
        function loadFromHistory(i) { currentData = JSON.parse(localStorage.getItem('pelada_db'))[i]; updateUI(); switchTab('dashboard'); }
    </script>
</body>
</html>
