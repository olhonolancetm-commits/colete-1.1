<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Pelada Pro Elite | Tactical Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

  <style>
    :root { color-scheme: dark; }
    body { font-family: 'Outfit', sans-serif; background-color:#020617; color:#f8fafc; overflow-x:hidden; }
    .glass { background: rgba(15,23,42,.72); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
    #heatmapLayer { position:absolute; inset:0; pointer-events:none; }
    .card-container { width:280px; height:420px; position:relative; filter: drop-shadow(0 22px 34px rgba(0,0,0,.55)); transition: 0.3s; }
    .card-container:hover { transform: translateY(-6px); }
    .card-bg { width:100%; height:100%; background: linear-gradient(135deg, #fbbf24 0%, #d97706 50%, #78350f 100%); clip-path: polygon(0% 15%, 50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%); position:absolute; inset:0; opacity:.98; }
    .card-photo { width:150px; height:150px; position:absolute; top:44px; right:14px; object-fit:cover; border-radius:18px; mask-image: linear-gradient(to bottom, black 80%, transparent 100%); box-shadow: 0 20px 40px rgba(0,0,0,.35); border: 1px solid rgba(0,0,0,.08); }
    .card-content { position:absolute; inset:0; z-index:2; color:#1f130a; padding:44px 22px; display:flex; flex-direction:column; }
    .tab-btn.active { border-bottom: 3px solid #f59e0b; color:#f59e0b; }
    .pitch-wrap { position:relative; border-radius: 22px; overflow:hidden; background: rgba(2,6,23,.35); border: 1px solid rgba(255,255,255,.06); box-shadow: 0 35px 80px rgba(0,0,0,.55); }
    .floaty { animation: floaty 4.2s ease-in-out infinite; }
    @keyframes floaty { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-6px);} }
  </style>
</head>

<body class="flex h-screen overflow-hidden">
  <!-- SIDEBAR (desktop) -->
  <aside id="sidebar" class="w-80 glass border-r border-white/10 p-6 flex flex-col gap-6 z-30 hidden md:flex">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-amber-500 rounded-2xl flex items-center justify-center font-black text-2xl text-black">P</div>
      <div>
        <h1 class="font-black text-xl italic leading-none">PELADA<span class="text-amber-500">PRO</span></h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Elite Tactical Unit</p>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Nome do Atleta</label>
        <input type="text" id="nameIn" placeholder="Ex: Neymar Jr" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none focus:border-amber-500 transition">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Posição</label>
          <select id="posIn" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none">
            <option value="ATA">Atacante</option>
            <option value="MEI">Meio-Campo</option>
            <option value="DEF">Zagueiro</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Ataque p/</label>
          <select id="sideIn" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none">
            <option value="up">Cima</option>
            <option value="down">Baixo</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Foto de Perfil</label>
        <input type="file" id="photoIn" accept="image/*" class="w-full text-xs text-slate-500">
      </div>

      <div class="mt-auto space-y-3">
        <label class="flex items-center justify-center gap-2 bg-white text-black p-4 rounded-2xl font-black cursor-pointer hover:bg-amber-500 transition">
          IMPORTAR ARQUIVO GPS
          <input type="file" id="csvFileInput" class="hidden">
        </label>
        <nav class="flex flex-col gap-1">
          <button onclick="switchTab('dashboard')" class="tab-btn active py-3 text-left font-bold px-4">Dashboard</button>
          <button onclick="switchTab('history')" class="tab-btn py-3 text-left font-bold px-4">Minha Coleção</button>
        </nav>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 overflow-y-auto">
    <section id="tab-dashboard" class="p-8 space-y-8 animate-in fade-in duration-700">
      <div class="flex justify-between items-end gap-3 flex-wrap">
        <div>
          <h2 class="text-4xl font-black italic tracking-tighter uppercase" id="titleName">NOVO ATLETA</h2>
          <div class="flex gap-3 mt-2">
            <span class="bg-amber-500/10 text-amber-500 text-[10px] font-bold px-3 py-1 rounded-full border border-amber-500/20" id="dateShow">AGUARDANDO...</span>
            <span class="bg-blue-500/10 text-blue-500 text-[10px] font-bold px-3 py-1 rounded-full border border-blue-500/20" id="posShow">STATUS: OFFLINE</span>
          </div>
        </div>
        <button onclick="saveSession()" id="btnSave" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-10 py-3 rounded-2xl font-black text-sm transition-all">SALVAR CARD</button>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
        <div class="xl:col-span-4 flex justify-center">
          <div class="card-container">
            <div class="card-bg"></div>
            <img id="cardPhoto" src="https://via.placeholder.com/200" class="card-photo">
            <div class="card-content">
              <div class="text-5xl font-black" id="cardOvr">--</div>
              <div class="text-lg font-bold opacity-70" id="cardPos">POS</div>
              <div class="mt-auto pt-6">
                <div class="text-2xl font-black uppercase text-center border-b-2 border-black/10 mb-2" id="cardName">PLAYER</div>
                <div class="grid grid-cols-2 gap-x-4 text-sm font-black">
                  <div>VEL <span class="float-right" id="s-vel">--</span></div>
                  <div>DRI <span class="float-right" id="s-dri">--</span></div>
                  <div>ATA <span class="float-right" id="s-ata">--</span></div>
                  <div>DEF <span class="float-right" id="s-def">--</span></div>
                  <div>PAS <span class="float-right" id="s-pas">--</span></div>
                  <div>FIS <span class="float-right" id="s-fis">--</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="xl:col-span-8 flex flex-col gap-6">
          <div class="glass p-6 rounded-3xl border-l-4 border-amber-500">
            <h4 class="text-amber-500 font-bold text-xs uppercase mb-3">Análise Tática da IA</h4>
            <p id="aiReport" class="text-slate-300 italic text-sm">Aguardando importação de dados...</p>
          </div>
          <div class="glass p-6 rounded-3xl h-64">
            <canvas id="loadChart"></canvas>
          </div>
          <div class="pitch-wrap floaty mx-auto w-full" style="height: 350px;">
             <div id="heatmapContainer" class="absolute inset-0"></div>
             <!-- SVG de fundo simplificado para referência -->
             <svg viewBox="0 0 920 560" class="absolute inset-0 w-full h-full opacity-20 pointer-events-none">
                <rect x="110" y="150" width="700" height="360" fill="none" stroke="white" stroke-width="2"/>
                <line x1="460" y1="150" x2="460" y2="510" stroke="white" stroke-width="2"/>
                <circle cx="460" cy="330" r="60" fill="none" stroke="white" stroke-width="2"/>
             </svg>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-history" class="hidden p-8 animate-in slide-in-from-right duration-500">
      <div class="flex justify-between items-center mb-10">
        <h2 class="text-4xl font-black italic uppercase">Coleção de Elite</h2>
        <button onclick="switchTab('dashboard')" class="bg-white/5 hover:bg-white/10 px-6 py-2 rounded-xl font-bold">VOLTAR</button>
      </div>
      <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
    </section>
  </main>

  <script>
    let heatmapInstance, loadChart, currentData = null, photoData = "https://via.placeholder.com/200";

    window.onload = () => {
      heatmapInstance = h337.create({ container: document.getElementById('heatmapContainer'), radius: 25, blur: 0.85 });
      renderHistory();
    };

    function switchTab(tab) {
      document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
      document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');
    }

    document.getElementById('photoIn').addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => { photoData = ev.target.result; document.getElementById('cardPhoto').src = photoData; };
      reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('nameIn').addEventListener('input', (e) => {
      const n = e.target.value || "PLAYER";
      document.getElementById('titleName').innerText = n;
      document.getElementById('cardName').innerText = n;
    });

    document.getElementById('csvFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (ev) => processFile(ev.target.result);
      reader.readAsText(file);
    });

    function processFile(text) {
      // Tenta limpar o conteúdo caso seja o formato "Excel/JSON" que alguns trackers geram
      let rows = [];
      try {
        if (text.trim().startsWith('[') || text.trim().startsWith('{')) {
          const json = JSON.parse(text);
          const dataArr = json[0]?.d || json;
          rows = dataArr.filter(r => Array.isArray(r) && !isNaN(parseFloat(r[3])));
        } else {
          // CSV comum
          rows = text.split('\n').map(line => line.split(',')).filter(cols => cols.length > 5 && !isNaN(parseFloat(cols[3])));
        }
      } catch (e) {
        alert("Erro ao processar o formato do arquivo."); return;
      }

      if (!rows.length) { alert("Nenhum dado GPS válido encontrado."); return; }

      const lats = rows.map(r => parseFloat(r[3]));
      const lngs = rows.map(r => parseFloat(r[4]));
      const speeds = rows.map(r => parseFloat(r[5]) || 0);
      const times = rows.map(r => r[2] || "00:00");

      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);

      const points = lats.map((lat, i) => ({
        x: Math.floor(((lngs[i] - minLng) / (maxLng - minLng || 1)) * 920),
        y: Math.floor(((lat - minLat) / (maxLat - minLat || 1)) * 560),
        value: speeds[i] || 1
      }));

      // Atributos base
      const role = document.getElementById('posIn').value;
      const vMax = Math.max(...speeds);
      const stats = {
        vel: Math.min(Math.round((vMax/8)*99), 99),
        dri: Math.min(Math.round((vMax/7)*99), 99),
        ata: role === 'ATA' ? 92 : 65,
        def: role === 'DEF' ? 90 : 40,
        pas: 82,
        fis: 85
      };

      currentData = {
        name: document.getElementById('nameIn').value || "PLAYER",
        role: role,
        date: new Date().toLocaleDateString('pt-BR'),
        ovr: Math.round((stats.vel + stats.ata + stats.def) / 3) + 10,
        stats, points, speeds, times, photo: photoData
      };

      updateDashboard();
    }

    function updateDashboard() {
      const d = currentData;
      document.getElementById('cardOvr').innerText = d.ovr;
      document.getElementById('cardPos').innerText = d.role;
      document.getElementById('s-vel').innerText = d.stats.vel;
      document.getElementById('s-dri').innerText = d.stats.dri;
      document.getElementById('s-ata').innerText = d.stats.ata;
      document.getElementById('s-def').innerText = d.stats.def;
      document.getElementById('s-pas').innerText = d.stats.pas;
      document.getElementById('s-fis').innerText = d.stats.fis;
      document.getElementById('btnSave').classList.remove('hidden');
      document.getElementById('aiReport').innerText = `Atleta com alto volume de movimentação. Velocidade máxima de ${Math.max(...d.speeds).toFixed(1)} m/s.`;
      
      heatmapInstance.setData({ max: 10, data: d.points });
      renderChart(d.speeds, d.times);
    }

    function renderChart(speeds, times) {
      if (loadChart) loadChart.destroy();
      const step = Math.ceil(speeds.length / 50);
      loadChart = new Chart(document.getElementById('loadChart'), {
        type: 'line',
        data: {
          labels: times.filter((_,i) => i % step === 0),
          datasets: [{ data: speeds.filter((_,i) => i % step === 0), borderColor: '#f59e0b', tension: 0.4, fill: true, backgroundColor: 'rgba(245,158,11,0.1)', pointRadius: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: 'rgba(255,255,255,0.05)' } } } }
      });
    }

    function saveSession() {
      let h = JSON.parse(localStorage.getItem('pelada_elite_h') || '[]');
      h.unshift(currentData);
      localStorage.setItem('pelada_elite_h', JSON.stringify(h.slice(0, 50)));
      alert("Salvo com sucesso!");
      renderHistory();
    }

    function renderHistory() {
      const h = JSON.parse(localStorage.getItem('pelada_elite_h') || '[]');
      const g = document.getElementById('historyGrid');
      g.innerHTML = h.map((c, i) => `
        <div class="glass p-6 rounded-3xl flex flex-col items-center gap-4">
          <div class="text-xl font-bold">${c.name} - ${c.ovr} OVR</div>
          <img src="${c.photo}" class="w-24 h-24 rounded-full object-cover">
          <button onclick="loadCard(${i})" class="bg-amber-500 text-black px-4 py-2 rounded-xl font-bold">REVISAR</button>
        </div>
      `).join('');
    }

    function loadCard(i) {
      currentData = JSON.parse(localStorage.getItem('pelada_elite_h'))[i];
      updateDashboard();
      switchTab('dashboard');
    }
  </script>
</body>
</html>
