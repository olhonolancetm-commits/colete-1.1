<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Pelada Pro Elite | Tactical Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

  <style>
    :root { color-scheme: dark; }
    body { font-family: 'Outfit', sans-serif; background-color:#020617; color:#f8fafc; overflow-x:hidden; }

    .glass {
      background: rgba(15,23,42,.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* Card Pro */
    .card-container { width:280px; height:420px; position:relative; filter: drop-shadow(0 22px 34px rgba(0,0,0,.55)); transition: 0.3s; }
    .card-container:hover { transform: translateY(-6px); }
    .card-bg {
      width:100%; height:100%;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 50%, #78350f 100%);
      clip-path: polygon(0% 15%, 50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%);
      position:absolute; inset:0;
    }
    .card-photo {
      width:150px; height:150px; position:absolute; top:44px; right:14px;
      object-fit:cover; border-radius:18px;
      mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
    }
    .card-content { position:absolute; inset:0; z-index:2; color:#1f130a; padding:44px 22px; display:flex; flex-direction:column; }
    .tab-btn.active { border-bottom: 3px solid #f59e0b; color:#f59e0b; }

    /* Estilização do Campo Estilo Data Factory */
    .pitch-wrap {
      position:relative;
      border-radius: 12px;
      overflow:hidden;
      background-color: #2e7d32; /* Grama externa */
      border: 4px solid #1a1a1a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    @keyframes floaty { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-6px);} }
    .floaty { animation: floaty 4.2s ease-in-out infinite; }
  </style>
</head>

<body class="flex h-screen overflow-hidden">
  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-80 glass border-r border-white/10 p-6 flex flex-col gap-6 z-30 hidden md:flex">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-amber-500 rounded-2xl flex items-center justify-center font-black text-2xl text-black">P</div>
      <div>
        <h1 class="font-black text-xl italic leading-none">PELADA<span class="text-amber-500">PRO</span></h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Elite Tactical Unit</p>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Nome do Atleta</label>
        <input type="text" id="nameIn" placeholder="Ex: Neymar Jr" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none focus:border-amber-500 transition">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Posição</label>
          <select id="posIn" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none">
            <option value="ATA">Atacante</option>
            <option value="MEI">Meio-Campo</option>
            <option value="DEF">Zagueiro</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Ataque p/</label>
          <select id="sideIn" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none">
            <option value="up">Cima</option>
            <option value="down">Baixo</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-500 uppercase px-1">Foto</label>
        <input type="file" id="photoIn" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:bg-amber-500 file:text-black">
      </div>
      <div class="mt-auto space-y-3">
        <label class="flex items-center justify-center gap-2 bg-white text-black p-4 rounded-2xl font-black cursor-pointer hover:bg-amber-500 transition">
          IMPORTAR CSV GPS
          <input type="file" id="csvFileInput" accept=".csv" class="hidden">
        </label>
        <nav class="flex flex-col gap-1">
          <button data-tab="dashboard" class="tab-btn active py-3 text-left font-bold px-4">Dashboard</button>
          <button data-tab="history" class="tab-btn py-3 text-left font-bold px-4">Minha Coleção</button>
        </nav>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 overflow-y-auto">
    <section id="tab-dashboard" class="p-8 space-y-8 animate-in fade-in duration-700">
      <div class="flex justify-between items-end flex-wrap gap-4">
        <div>
          <h2 class="text-4xl font-black italic tracking-tighter uppercase" id="titleName">NOVO ATLETA</h2>
          <div class="flex gap-3 mt-2">
            <span class="bg-amber-500/10 text-amber-500 text-[10px] font-bold px-3 py-1 rounded-full border border-amber-500/20" id="dateShow">AGUARDANDO...</span>
            <span class="bg-blue-500/10 text-blue-500 text-[10px] font-bold px-3 py-1 rounded-full border border-blue-500/20" id="posShow">STATUS: OFFLINE</span>
          </div>
        </div>
        <button onclick="saveSession()" id="btnSave" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-10 py-3 rounded-2xl font-black text-sm shadow-xl transition-all">SALVAR CARD</button>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
        <!-- CARD -->
        <div class="xl:col-span-4 flex justify-center py-3">
          <div class="card-container">
            <div class="card-bg"></div>
            <img id="cardPhoto" src="https://via.placeholder.com/200" class="card-photo">
            <div class="card-content">
              <div class="text-5xl font-black" id="cardOvr">--</div>
              <div class="text-lg font-bold opacity-70" id="cardPos">POS</div>
              <div class="mt-auto pt-6">
                <div class="text-2xl font-black uppercase text-center border-b-2 border-black/10 mb-2" id="cardName">PLAYER</div>
                <div class="grid grid-cols-2 gap-x-4 text-sm font-black">
                  <div>VEL <span class="float-right" id="s-vel">--</span></div>
                  <div>DRI <span class="float-right" id="s-dri">--</span></div>
                  <div>ATA <span class="float-right" id="s-ata">--</span></div>
                  <div>DEF <span class="float-right" id="s-def">--</span></div>
                  <div>PAS <span class="float-right" id="s-pas">--</span></div>
                  <div>FIS <span class="float-right" id="s-fis">--</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TACTICAL VIEW -->
        <div class="xl:col-span-8 flex flex-col gap-6">
          <div class="glass p-6 rounded-3xl border-l-4 border-amber-500">
            <h4 class="text-amber-500 font-bold text-xs uppercase mb-3 flex items-center gap-2">Análise Tática da IA</h4>
            <p id="aiReport" class="text-slate-300 italic leading-relaxed">Aguardando dados de GPS...</p>
          </div>

          <div class="glass p-6 rounded-3xl flex-1">
            <h4 class="text-slate-500 font-bold text-xs uppercase mb-4 text-center">Mapa de Calor GPS (Centralizado na 5ª Posição)</h4>
            
            <div class="pitch-wrap floaty mx-auto" style="height: 400px; max-width: 700px;">
              <div class="relative h-full w-full">
                <!-- SVG Campo Estilo Profissional -->
                <svg viewBox="0 0 920 600" class="absolute inset-0 w-full h-full">
                  <defs>
                    <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#0d1b3e"/>
                      <stop offset="100%" stop-color="#162c5b"/>
                    </linearGradient>
                  </defs>
                  <!-- Pitch central em azul escuro -->
                  <path d="M120,550 L800,550 L700,50 L220,50 Z" fill="url(#pitchGrad)" stroke="white" stroke-width="2"/>
                  <!-- Linhas -->
                  <line x1="170" y1="300" x2="750" y2="300" stroke="white" stroke-width="2" opacity="0.5"/> <!-- Meio -->
                  <circle cx="460" cy="300" r="60" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
                  <!-- Gols -->
                  <rect x="410" y="35" width="100" height="15" fill="none" stroke="white" stroke-width="2" opacity="0.8"/> <!-- Gol cima -->
                  <rect x="410" y="550" width="100" height="15" fill="none" stroke="white" stroke-width="2" opacity="0.8"/> <!-- Gol baixo -->
                  <!-- Áreas -->
                  <path d="M300,50 L620,50 L580,150 L340,150 Z" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
                  <path d="M300,550 L620,550 L580,450 L340,450 Z" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
                </svg>
                <!-- Camada de Calor -->
                <div id="heatmapContainer" class="absolute inset-0"></div>
              </div>
            </div>
            <div id="graphContainer" class="mt-6 h-[150px]">
              <canvas id="loadChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </section>
    
    <section id="tab-history" class="hidden p-8 animate-in slide-in-from-right duration-500">
      <div class="flex justify-between items-center mb-10">
        <h2 class="text-4xl font-black italic uppercase">Coleção de Elite</h2>
        <button onclick="switchTab('dashboard')" class="bg-white/5 px-6 py-2 rounded-xl font-bold">VOLTAR</button>
      </div>
      <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-3 gap-10"></div>
    </section>
  </main>

  <script>
    let heatmapInstance;
    let loadChart;
    let currentData = null;
    let photoData = "https://via.placeholder.com/200";

    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

    function switchTab(tab) {
      document.querySelectorAll('[data-tab]').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-tab') === tab));
      document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
      document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');
    }

    document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab'))));

    function initHeatmap() {
      const container = document.getElementById('heatmapContainer');
      heatmapInstance = h337.create({
        container,
        radius: 35,
        blur: 0.8,
        maxOpacity: 0.6,
        gradient: { '.3': 'blue', '.5': 'lime', '.7': 'yellow', '.95': 'red' }
      });
    }

    // Lógica de Projeção Tática (5ª Posição como Centro)
    function projectToPitchRelative(lat, lng, originLat, originLng) {
      const SVG_WIDTH = 920;
      const SVG_HEIGHT = 600;
      const CENTER_X = SVG_WIDTH / 2;
      const CENTER_Y = SVG_HEIGHT / 2;

      // Escala para GPS (coletes variam muito pouco, então multiplicamos a diferença)
      const scale = 450000; 

      const diffLat = lat - originLat;
      const diffLng = lng - originLng;

      // Na perspectiva 3D do SVG: 
      // X = longitude (horizontal), Y = latitude (vertical)
      let x = CENTER_X + (diffLng * scale);
      let y = CENTER_Y - (diffLat * scale);

      // Aplica uma leve distorção trapezoidal para casar com o desenho 3D do campo
      const perspectiveFactor = clamp((y / SVG_HEIGHT), 0.4, 1);
      x = CENTER_X + (x - CENTER_X) * perspectiveFactor;

      return { x, y };
    }

    function parsePeladaCSV(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const headerLine = lines.find(l => l.includes("Tempo_ms") && l.includes("Latitude"));
      if (!headerLine) return { error: "Cabeçalho não encontrado." };

      const header = headerLine.split(',');
      const idxLat = header.indexOf("Latitude");
      const idxLng = header.indexOf("Longitude");
      const idxVel = header.indexOf("Velocidade");
      const idxTime = header.indexOf("Hora_UTC");

      const dataRows = [];
      lines.slice(lines.indexOf(headerLine) + 1).forEach(line => {
        if (line.startsWith("STOP")) return;
        const row = line.split(',');
        if (row.length < header.length) return;
        const lat = parseFloat(row[idxLat]);
        const lng = parseFloat(row[idxLng]);
        if (!isNaN(lat) && lat !== 0) {
          dataRows.push({ lat, lng, vel: parseFloat(row[idxVel]) || 0, time: row[idxTime] });
        }
      });

      // REGRA: Quinta posição como origem (Centro)
      const origin = dataRows.length >= 5 ? dataRows[4] : dataRows[0];
      
      let vMax = 0;
      lines.forEach(l => { if(l.includes("VEL_MAX=")) vMax = parseFloat(l.split('=')[1]); });

      return { dataRows, origin, vMax };
    }

    function processCSV(text) {
      const result = parsePeladaCSV(text);
      if (result.error) return alert(result.error);

      const points = [];
      const speeds = [];
      const labels = [];

      result.dataRows.forEach(r => {
        const proj = projectToPitchRelative(r.lat, r.lng, result.origin.lat, result.origin.lng);
        points.push({ x: proj.x, y: proj.y, value: clamp(r.vel, 5, 20) });
        speeds.push(r.vel);
        labels.push(r.time);
      });

      const role = document.getElementById('posIn').value;
      const vMax = result.vMax || Math.max(...speeds);
      const vMean = speeds.reduce((a,b) => a+b, 0) / speeds.length;

      const stats = {
        vel: clamp(Math.round((vMax / 6) * 99), 30, 99),
        dri: clamp(Math.round(vMean * 20 + 40), 30, 99),
        ata: role === 'ATA' ? 88 : 65,
        def: role === 'DEF' ? 88 : 55,
        fis: clamp(Math.round(vMean * 25 + 30), 30, 99),
        pas: 75
      };

      let ovr = (stats.vel + stats.fis + (role === 'ATA' ? stats.ata : stats.def)) / 3;

      currentData = {
        name: document.getElementById('nameIn').value || "PLAYER",
        role, ovr: Math.round(ovr), stats, points, speeds, labels, photo: photoData,
        date: new Date().toLocaleDateString('pt-BR')
      };

      updateUI();
    }

    function updateUI() {
      const d = currentData;
      document.getElementById('titleName').innerText = d.name;
      document.getElementById('cardName').innerText = d.name;
      document.getElementById('cardOvr').innerText = d.ovr;
      document.getElementById('cardPos').innerText = d.role;
      document.getElementById('s-vel').innerText = d.stats.vel;
      document.getElementById('s-dri').innerText = d.stats.dri;
      document.getElementById('s-ata').innerText = d.stats.ata;
      document.getElementById('s-def').innerText = d.stats.def;
      document.getElementById('s-pas').innerText = d.stats.pas;
      document.getElementById('s-fis').innerText = d.stats.fis;
      document.getElementById('dateShow').innerText = d.date;
      document.getElementById('btnSave').classList.remove('hidden');

      heatmapInstance.setData({ max: 20, data: d.points });
      renderChart(d.speeds, d.labels);

      document.getElementById('aiReport').innerText = `O atleta ${d.name} apresentou um posicionamento tático focado no setor central, com picos de velocidade de ${(Math.max(...d.speeds)*3.6).toFixed(1)} km/h.`;
    }

    function renderChart(data, labels) {
      if (loadChart) loadChart.destroy();
      const ctx = document.getElementById('loadChart').getContext('2d');
      loadChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.filter((_, i) => i % 20 === 0),
          datasets: [{
            data: data.filter((_, i) => i % 20 === 0),
            borderColor: '#f59e0b',
            fill: true,
            backgroundColor: 'rgba(245,158,11,0.1)',
            tension: 0.4,
            pointRadius: 0
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
      });
    }

    function saveSession() {
      let h = JSON.parse(localStorage.getItem('pelada_elite_h') || '[]');
      h.unshift(currentData);
      localStorage.setItem('pelada_elite_h', JSON.stringify(h.slice(0, 50)));
      alert("Card salvo na coleção!");
      renderHistory();
      switchTab('history');
    }

    function renderHistory() {
      const h = JSON.parse(localStorage.getItem('pelada_elite_h') || '[]');
      const g = document.getElementById('historyGrid');
      g.innerHTML = h.map((c, i) => `
        <div class="glass p-6 rounded-3xl flex flex-col items-center">
          <div class="card-container scale-75 -my-10">
            <div class="card-bg"></div>
            <img src="${c.photo}" class="card-photo">
            <div class="card-content">
              <div class="text-4xl font-black">${c.ovr}</div>
              <div class="text-sm font-bold">${c.role}</div>
              <div class="mt-auto text-xl font-black uppercase text-center">${c.name}</div>
            </div>
          </div>
          <button onclick="loadCard(${i})" class="mt-4 bg-amber-500 text-black px-6 py-2 rounded-xl font-bold">REVISAR</button>
        </div>
      `).join('');
    }

    function loadCard(i) {
      currentData = JSON.parse(localStorage.getItem('pelada_elite_h'))[i];
      updateUI();
      switchTab('dashboard');
    }

    // Event Listeners
    document.getElementById('csvFileInput').addEventListener('change', e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = ev => processCSV(ev.target.result);
      reader.readAsText(file);
    });

    document.getElementById('photoIn').addEventListener('change', e => {
      const reader = new FileReader();
      reader.onload = ev => { photoData = ev.target.result; document.getElementById('cardPhoto').src = photoData; };
      reader.readAsDataURL(e.target.files[0]);
    });

    window.onload = () => { initHeatmap(); renderHistory(); };
    window.saveSession = saveSession;
    window.loadCard = loadCard;
  </script>
</body>
</html>
