<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelada Pro v2 | Tactical Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* CAMPO 3D */
        .field-container { perspective: 1000px; width: 100%; height: 450px; display: flex; justify-content: center; align-items: center; }
        #field-3d { 
            width: 500px; height: 350px; background: #15803d; border: 4px solid white; position: relative;
            transform: rotateX(40deg); box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .line { position: absolute; border: 1px solid white; pointer-events: none; }
        .mid-line { top: 50%; left: 0; right: 0; height: 0; }

        /* CARD FIFA */
        .card-fifa {
            width: 260px; height: 380px; background: linear-gradient(135deg, #fcd34d 0%, #b45309 100%);
            clip-path: polygon(0% 12%, 50% 0%, 100% 12%, 100% 88%, 50% 100%, 0% 88%);
            position: relative; color: #451a03; box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .card-img { width: 160px; height: 160px; position: absolute; top: 40px; right: 5px; object-fit: cover; mask-image: linear-gradient(to bottom, black 80%, transparent 100%); }
        .card-ovr { position: absolute; top: 40px; left: 25px; font-size: 44px; font-weight: 900; }
        .card-pos-text { position: absolute; top: 85px; left: 25px; font-size: 18px; font-weight: 700; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- SIDEBAR DE CONFIGURAÇÃO -->
    <aside class="w-80 glass p-6 flex flex-col gap-6 z-20 border-r border-white/5">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 bg-yellow-500 rounded-xl flex items-center justify-center font-black text-black">P</div>
            <h1 class="font-black text-xl italic tracking-tighter">PELADA<span class="text-yellow-500">PRO</span></h1>
        </div>

        <div class="space-y-4">
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Perfil do Atleta</p>
            <input type="text" id="nameInput" placeholder="Seu Nome" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none focus:border-yellow-500">
            
            <select id="roleInput" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none">
                <option value="ATA" class="bg-slate-900">Atacante</option>
                <option value="MEI" class="bg-slate-900">Meio-Campo</option>
                <option value="DEF" class="bg-slate-900">Zagueiro/Lateral</option>
            </select>

            <select id="sideInput" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm outline-none">
                <option value="up" class="bg-slate-900">Atacando p/ Cima</option>
                <option value="down" class="bg-slate-900">Atacando p/ Baixo</option>
            </select>

            <div class="space-y-2">
                <label class="text-[10px] text-slate-500 uppercase font-bold">Foto de Perfil</label>
                <input type="file" id="photoInput" accept="image/*" class="text-xs">
            </div>
        </div>

        <div class="mt-auto space-y-3">
            <label class="flex items-center justify-center gap-2 bg-yellow-500 text-black p-4 rounded-2xl font-black cursor-pointer hover:scale-105 transition">
                IMPORTAR CSV
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
            </label>
            <button onclick="switchTab('history')" class="w-full py-3 text-xs font-bold text-slate-400 hover:text-white transition">VER MINHA COLEÇÃO</button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 overflow-y-auto relative">
        
        <!-- DASHBOARD TAB -->
        <section id="tab-dashboard" class="p-10 space-y-8 animate-in fade-in duration-500">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-4xl font-black italic uppercase">Análise de Jogo</h2>
                    <p id="dateDisplay" class="text-slate-500">Aguardando dados...</p>
                </div>
                <button onclick="saveCard()" id="saveBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-full font-black text-sm transition">SALVAR NO HISTÓRICO</button>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-10">
                <!-- CARD PREVIEW -->
                <div class="flex flex-col items-center gap-6">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Seu Card de Atleta</h3>
                    <div id="card-preview" class="card-fifa">
                        <div class="card-ovr" id="ovrText">--</div>
                        <div class="card-pos-text" id="posText">POS</div>
                        <img id="cardImg" src="https://via.placeholder.com/150" class="card-img">
                        <div class="absolute top-[210px] w-full text-center">
                            <div class="text-xl font-black uppercase tracking-tighter mx-4 border-b border-black/20 pb-1" id="nameText">JOGADOR</div>
                            <div class="grid grid-cols-2 gap-x-2 px-8 pt-2 text-[14px] font-black">
                                <div class="text-left">VEL <span id="stat-vel" class="float-right text-black/60">--</span></div>
                                <div class="text-left">ATA <span id="stat-ata" class="float-right text-black/60">--</span></div>
                                <div class="text-left">PAS <span id="stat-pas" class="float-right text-black/60">--</span></div>
                                <div class="text-left">DEF <span id="stat-def" class="float-right text-black/60">--</span></div>
                                <div class="text-left">FIS <span id="stat-fis" class="float-right text-black/60">--</span></div>
                                <div class="text-left">POS <span id="stat-pos" class="float-right text-black/60">--</span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CAMPO HEATMAP -->
                <div class="space-y-4">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Mapa de Posicionamento</h3>
                    <div class="field-container">
                        <div id="field-3d">
                            <div class="line mid-line"></div>
                            <div id="heatmapContainer" class="absolute inset-0"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- HISTORY TAB -->
        <section id="tab-history" class="hidden p-10 animate-in slide-in-from-right duration-500">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-4xl font-black italic uppercase">Minha Coleção</h2>
                <button onclick="switchTab('dashboard')" class="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-xl text-sm font-bold transition">← VOLTAR</button>
            </div>
            <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                <!-- Injetado por JS -->
            </div>
        </section>
    </main>

    <script>
        let heatmapInstance;
        let currentData = null;
        let photoBase64 = "https://via.placeholder.com/150";

        window.onload = () => {
            initHeatmap();
            renderHistory();
        };

        function initHeatmap() {
            heatmapInstance = h337.create({
                container: document.getElementById('heatmapContainer'),
                radius: 20, blur: .8, maxOpacity: .6
            });
        }

        // Preview da Foto
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                photoBase64 = ev.target.result;
                document.getElementById('cardImg').src = photoBase64;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');
        }

        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => processCSV(ev.target.result);
            reader.readAsText(file);
        });

        function processCSV(csv) {
            const lines = csv.split('\n');
            let lats = [], lngs = [], speeds = [];
            let totalDist = 0, velMax = 0, sumVel = 0;

            lines.forEach(line => {
                if(line.includes('TOTAL_DISTANCIA=')) totalDist = parseFloat(line.split('=')[1]);
                if(line.includes('VEL_MAX=')) velMax = parseFloat(line.split('=')[1]);
                
                const cols = line.split(',');
                if (cols.length > 5 && !isNaN(cols[0])) {
                    const lat = parseFloat(cols[3]), lng = parseFloat(cols[4]), vel = parseFloat(cols[5]);
                    if (lat !== 0) {
                        lats.push(lat); lngs.push(lng); speeds.push(vel);
                        sumVel += vel;
                    }
                }
            });

            if (lats.length === 0) return alert("Arquivo inválido");

            const minLat = Math.min(...lats), maxLat = Math.max(...lats);
            const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
            const latRange = (maxLat - minLat) || 1;
            const lngRange = (maxLng - minLng) || 1;

            const points = lats.map((lat, i) => ({
                x: Math.floor(((lngs[i] - minLng) / lngRange) * 500),
                y: Math.floor(((lat - minLat) / latRange) * 350),
                value: 1
            }));

            // LÓGICA DE POSICIONAMENTO (ATAQUE vs DEFESA)
            const side = document.getElementById('sideInput').value;
            let attackPoints = 0;
            points.forEach(p => {
                if(side === 'up' && p.y < 175) attackPoints++;
                if(side === 'down' && p.y > 175) attackPoints++;
            });

            const attackPercent = Math.round((attackPoints / points.length) * 100);
            const defensePercent = 100 - attackPercent;
            const avgSpeed = (sumVel / speeds.length).toFixed(1);

            currentData = {
                name: document.getElementById('nameInput').value || "JOGADOR",
                role: document.getElementById('roleInput').value,
                date: new Date().toLocaleDateString('pt-BR'),
                stats: {
                    vel: Math.round((velMax / 33) * 99),
                    ata: attackPercent,
                    def: defensePercent,
                    pas: Math.round((totalDist / 6000) * 85),
                    fis: Math.round((totalDist / 7000) * 99),
                    avgSpeed: avgSpeed
                },
                points: points,
                photo: photoBase64
            };

            calculateOverall();
            updateUI();
        }

        function calculateOverall() {
            const s = currentData.stats;
            const role = currentData.role;
            let ovr = 0;

            if(role === 'ATA') ovr = (s.ata * 0.5) + (s.vel * 0.3) + (s.fis * 0.2);
            else if(role === 'DEF') ovr = (s.def * 0.5) + (s.fis * 0.3) + (s.vel * 0.2);
            else ovr = (s.fis * 0.4) + (s.ata * 0.3) + (s.def * 0.3);

            currentData.ovr = Math.min(Math.round(ovr), 99);
        }

        function updateUI() {
            document.getElementById('nameText').innerText = currentData.name;
            document.getElementById('posText').innerText = currentData.role;
            document.getElementById('ovrText').innerText = currentData.ovr;
            document.getElementById('stat-vel').innerText = currentData.stats.vel;
            document.getElementById('stat-ata').innerText = currentData.stats.ata;
            document.getElementById('stat-def').innerText = currentData.stats.def;
            document.getElementById('stat-pas').innerText = currentData.stats.pas;
            document.getElementById('stat-fis').innerText = currentData.stats.fis;
            document.getElementById('stat-pos').innerText = currentData.stats.avgSpeed;
            
            document.getElementById('dateDisplay').innerText = `Sessão: ${currentData.date}`;
            document.getElementById('saveBtn').classList.remove('hidden');
            
            heatmapInstance.setData({ max: 20, data: currentData.points });
        }

        function saveCard() {
            let history = JSON.parse(localStorage.getItem('pelada_pro_history') || '[]');
            history.unshift(currentData);
            localStorage.setItem('pelada_pro_history', JSON.stringify(history.slice(0, 100)));
            alert("Card adicionado à sua coleção!");
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('pelada_pro_history') || '[]');
            const container = document.getElementById('historyGrid');
            
            if(history.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-slate-700 font-bold border-2 border-dashed border-slate-800 rounded-3xl">Coleção vazia. Importe um CSV e salve seu primeiro card!</div>`;
                return;
            }

            container.innerHTML = history.map((card, index) => `
                <div class="glass p-6 rounded-3xl flex flex-col items-center gap-4 hover:border-yellow-500/50 transition">
                    <div class="card-fifa scale-75 -my-10">
                        <div class="card-ovr">${card.ovr}</div>
                        <div class="card-pos-text">${card.role}</div>
                        <img src="${card.photo}" class="card-img">
                        <div class="absolute top-[210px] w-full text-center">
                            <div class="text-xl font-black uppercase tracking-tighter mx-4 border-b border-black/20 pb-1">${card.name}</div>
                            <div class="grid grid-cols-2 gap-x-2 px-8 pt-2 text-[14px] font-black">
                                <div class="text-left">VEL <span class="float-right text-black/60">${card.stats.vel}</span></div>
                                <div class="text-left">ATA <span class="float-right text-black/60">${card.stats.ata}</span></div>
                                <div class="text-left">PAS <span class="float-right text-black/60">${card.stats.pas}</span></div>
                                <div class="text-left">DEF <span class="float-right text-black/60">${card.stats.def}</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-2">
                        <p class="font-bold text-white">${card.date}</p>
                        <button onclick="loadCard(${index})" class="text-yellow-500 text-xs font-bold uppercase mt-2">Ver Detalhes</button>
                    </div>
                </div>
            `).join('');
        }

        function loadCard(index) {
            const history = JSON.parse(localStorage.getItem('pelada_pro_history'));
            currentData = history[index];
            updateUI();
            switchTab('dashboard');
        }
    </script>
</body>
</html>
