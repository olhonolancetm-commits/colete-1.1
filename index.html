<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelada Pro Cloud v2.0</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcru_aT1uFNMmXucRIUj5CMR6Sn_HU65s",
  authDomain: "colete-esportivo.firebaseapp.com",
  databaseURL: "https://colete-esportivo-default-rtdb.firebaseio.com",
  projectId: "colete-esportivo",
  storageBucket: "colete-esportivo.firebasestorage.app",
  messagingSenderId: "968163363788",
  appId: "1:968163363788:web:e5ff0b72936655900c2b69",
  measurementId: "G-X2WR5TJJSF"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.startMatch = async function(id){
 await set(ref(db, `devices/${id}/command`), "start");
 alert("Comando START enviado");
}

window.stopMatch = async function(id){
 await set(ref(db, `devices/${id}/command`), "stop");
 alert("Comando STOP enviado");
}

function renderDevices(data){
 const root = document.getElementById("devices");
 root.innerHTML = "";

 if(!data){
   root.innerHTML="<p>Nenhum dispositivo encontrado.</p>";
   return;
 }

 Object.entries(data).forEach(([id,dev])=>{
   const card=document.createElement("div");
   card.className="card";

   card.innerHTML=`
   <h3>${id}</h3>
   <p>Status: ${dev.online ? "🟢 Online":"🔴 Offline"}</p>
   <p>GPS: ${dev.gpsFix ? "✅ FIX":"⌛ Procurando"}</p>
   <p>Satélites: ${dev.satellites ?? 0}</p>
   <p>HDOP: ${dev.hdop ?? "-"}</p>
   <p>Bateria: ${dev.battery ?? "-"}V</p>
   <p>Gravando: ${dev.recording ? "SIM":"NÃO"}</p>

   <button onclick="startMatch('${id}')">INICIAR PARTIDA</button>
   <button onclick="stopMatch('${id}')">ENCERRAR PARTIDA</button>
   `;

   root.appendChild(card);
 });
}

onValue(ref(db,"devices"),(snap)=>{
 renderDevices(snap.val());
});
</script>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
padding:30px;
}
h1{color:#f59e0b}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}
.card{
background:#1e293b;
padding:20px;
border-radius:16px;
border:1px solid #334155;
}
button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>
<body>

<h1>PELADA PRO CLOUD v2.0</h1>

<h2>Dispositivos Online</h2>

<div id="devices" class="grid">
Carregando...
</div>

<hr>

<h2>Estrutura esperada no Firebase</h2>

<pre>
devices
 └─ TRACKER-XXXXXX
      online: true
      gpsFix: true
      satellites: 9
      hdop: 1.2
      battery: 4.12
      recording: false
      command: ""
</pre>

</body>
</html
