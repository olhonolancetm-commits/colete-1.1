<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelada Pro | Advanced Tactical Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        /* Desenho de campo profissional */
        .soccer-field { position: relative; width: 100%; height: 450px; background: #064e3b; border: 4px solid white; border-radius: 8px; overflow: hidden; }
        .field-lines { position: absolute; inset: 10px; border: 2px solid rgba(255,255,255,0.3); }
        .mid-line { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px solid rgba(255,255,255,0.3); }
        .center-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }
    </style>
</head>
<body class="flex">

    <aside class="w-64 sidebar glass border-r border-white/5 p-6 flex flex-col gap-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-black text-xl">P</div>
            <span class="font-black text-xl tracking-tighter">PELADA<span class="text-blue-500">PRO</span></span>
        </div>
        <nav class="flex flex-col gap-4">
            <button onclick="switchTab('dashboard')" class="p-3 rounded-xl hover:bg-white/5 transition font-semibold">Dashboard</button>
            <button onclick="switchTab('history')" class="p-3 rounded-xl hover:bg-white/5 transition font-semibold">Histórico</button>
        </nav>
        <label class="mt-auto bg-blue-600 hover:bg-blue-500 p-3 rounded-xl cursor-pointer text-center font-bold transition">
            NOVO JOGO
            <input type="file" id="csvFileInput" accept=".csv" class="hidden">
        </label>
    </aside>

    <main class="flex-1 p-10">
        <section id="tab-dashboard" class="space-y-8">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-3xl font-black italic">ANÁLISE DE PERFORMANCE</h2>
                    <p class="text-slate-400" id="current-session-date">Aguardando importação...</p>
                </div>
                <button onclick="saveCurrentPerformance()" id="btnSave" class="hidden bg-emerald-600 px-6 py-2 rounded-full font-bold">SALVAR HISTÓRICO</button>
            </div>

            <div class="grid grid-cols-4 gap-6">
                <div class="glass p-6 rounded-2xl"><p class="text-xs uppercase text-slate-400">Distância</p><h3 class="text-3xl font-black" id="kpi-dist">0.0km</h3></div>
                <div class="glass p-6 rounded-2xl"><p class="text-xs uppercase text-slate-400">Vel. Máx</p><h3 class="text-3xl font-black" id="kpi-vel">0.0km/h</h3></div>
                <div class="glass p-6 rounded-2xl"><p class="text-xs uppercase text-slate-400">Sprints</p><h3 class="text-3xl font-black" id="kpi-sprints">0</h3></div>
                <div class="glass p-6 rounded-2xl"><p class="text-xs uppercase text-slate-400">Tempo</p><h3 class="text-3xl font-black" id="kpi-time">00:00:00</h3></div>
            </div>

            <div class="grid grid-cols-3 gap-8">
                <div class="col-span-2 soccer-field" id="field-container">
                    <div class="field-lines"></div><div class="mid-line"></div><div class="center-circle"></div>
                    <div id="heatmapContainer" class="absolute inset-0"></div>
                </div>
                <div class="space-y-6">
                    <div class="glass p-6 rounded-3xl"><h4 class="font-bold mb-2">DIAGNÓSTICO TÁTICO</h4><p id="coach-text" class="text-sm text-slate-400">Aguardando dados...</p></div>
                    <div class="glass p-6 rounded-3xl h-48"><canvas id="loadChart"></canvas></div>
                </div>
            </div>
        </section>

        <section id="tab-history" class="hidden space-y-6">
            <h2 class="text-3xl font-black">HISTÓRICO</h2>
            <div id="history-list" class="space-y-4"></div>
        </section>
    </main>

    <script>
        let heatmapInstance = h337.create({ container: document.getElementById('heatmapContainer'), radius: 30, blur: .8, maxOpacity: .5 });
        let loadChart;

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function calculateScore(stats) {
            const score = (stats.dist * 0.4) + (stats.velMax * 2) + (stats.sprints * 10);
            if (score > 5000) return "Atleta Elite: Intensidade máxima!";
            if (stats.sprints > 15) return "Jogador Explosivo: Focado em transição.";
            return "Perfil Equilibrado: Boa gestão de energia.";
        }

        function processCSV(csv) {
            const lines = csv.split('\n');
            let lats = [], lngs = [], speeds = [], times = [];
            let stats = { dist: 0, velMax: 0, sprints: 0, time: 0 };

            lines.forEach(line => {
                if(line.includes('TOTAL_DISTANCIA=')) stats.dist = parseFloat(line.split('=')[1]);
                if(line.includes('VEL_MAX=')) stats.velMax = parseFloat(line.split('=')[1]);
                if(line.includes('TEMPO_CORRENDO=')) stats.time += parseInt(line.split('=')[1]);
                
                const cols = line.split(',');
                if (cols.length > 10 && !isNaN(cols[3])) {
                    const lat = parseFloat(cols[3]), lng = parseFloat(cols[4]), vel = parseFloat(cols[5]);
                    if (lat !== 0) {
                        lats.push(lat); lngs.push(lng); speeds.push(vel); times.push(cols[2]);
                        if(vel > 21) stats.sprints++;
                    }
                }
            });

            if (lats.length === 0) return alert('Arquivo inválido.');

            const minLat = Math.min(...lats), maxLat = Math.max(...lats);
            const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
            const latRange = (maxLat - minLat) || 1;
            const lngRange = (maxLng - minLng) || 1;

            const points = lats.map((_, i) => ({
                x: Math.floor(((lngs[i] - minLng) / lngRange) * 800),
                y: Math.floor(((lats[i] - minLat) / latRange) * 450),
                value: 1
            }));

            currentGameData = { date: new Date().toLocaleString(), stats, points, speeds, times };
            updateDashboard(currentGameData);
            document.getElementById('btnSave').classList.remove('hidden');
        }

        function updateDashboard(data) {
            document.getElementById('kpi-dist').innerText = (data.stats.dist/1000).toFixed(2) + "km";
            document.getElementById('kpi-vel').innerText = data.stats.velMax.toFixed(1) + "km/h";
            document.getElementById('kpi-sprints').innerText = data.stats.sprints;
            document.getElementById('kpi-time').innerText = formatTime(data.stats.time);
            document.getElementById('coach-text').innerText = calculateScore(data.stats);
            heatmapInstance.setData({ max: 10, data: data.points });
        }

        function saveCurrentPerformance() {
            let history = JSON.parse(localStorage.getItem('pelada_pro_history') || '[]');
            history.unshift(currentGameData);
            localStorage.setItem('pelada_pro_history', JSON.stringify(history.slice(0, 50)));
            renderHistory();
            alert('Salvo!');
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('pelada_pro_history') || '[]');
            const container = document.getElementById('history-list');
            if(history.length === 0) container.innerHTML = '<div class="text-center py-20 text-slate-600">Nenhum jogo salvo.</div>';
            else container.innerHTML = history.map((g, i) => `<div class="glass p-4 rounded-xl flex justify-between"><span>${g.date}</span><span class="font-bold">${(g.stats.dist/1000).toFixed(2)}km</span></div>`).join('');
        }

        document.getElementById('csvFileInput').addEventListener('change', e => {
            const reader = new FileReader();
            reader.onload = e => processCSV(e.target.result);
            reader.readAsText(e.target.files[0]);
        });

        function switchTab(t) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', t !== 'dashboard');
            document.getElementById('tab-history').classList.toggle('hidden', t !== 'history');
        }
    </script>
</body>
</html>
